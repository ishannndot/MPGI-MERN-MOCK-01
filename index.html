<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Application Manager</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <h1>Student Application Manager</h1>

    <form id="studentForm" novalidate>

      <label for="name">Student Name</label>
      <input type="text" id="name">
      <span id="nameError"></span>

      <label for="email">Email</label>
      <input type="email" id="email">
      <span id="emailError"></span>

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone">
      <span id="phoneError"></span>

      <label for="dob">Date of Birth</label>
      <input type="date" id="dob">
      <span id="dobError"></span>

      <label>Gender</label>

      <div class="options">
          <label></label><input type="radio" name="gender" value="Male">Male</label>
          <label></label><input type="radio" name="gender" value="Female">Female</label>          
          <label></label><input type="radio" name="gender" value="Other">Other</label>
      </div>
      <span id="genderError"></span>
      <label for="course">Course</label>
      <select id="course">

        <option value="">Select a course</option>
        <option value="Web Development">Web Development</option>
        <option value="UI/UX">UI/UX</option>
        <option value="Python">Python</option>
        <option value="Data Analytics">Data Analytics</option>

      </select>

      <span id="courseError"></span>


      <label>Skills</label>

      <div class="options">
          <label></label><input type="checkbox" name="skills" value="HTML">HTML</label>
          <label></label><input type="checkbox" name="skills" value="CSS">CSS</label>
          <label></label><input type="checkbox" name="skills" value="JavaScript">JavaScript</label>
          <label></label><input type="checkbox" name="skills" value="Git">Git</label>
      </div>
      <span id="skillsError"></span>
      
      <label for="about">About Student</label>
      <textarea
        id="about"
        rows="4"
        placeholder="Write something about the student"></textarea>
      
      <span id="aboutError"></span>
      <label for="photo">Profile Photo</label>
      <input
        type="file"
        id="photo"
        accept="image/*">
      
      <span id="photoError"></span>
      <button type="submit">Submit</button>
      
    </form>

    <section class="total-section">
      <h2>Total Students:<span id="studentCount">0</span></h2>
        
    </section>

    <section>
      <h2>Submitted Students</h2>
      <div id="studentCards" class="student-cards">

      </div>

      
    </section>
  </div>
  <script src="script.js"></script>

</body>
</html>
